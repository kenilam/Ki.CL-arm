# The wire's code, from proto/: TypeScript for the remote, Python for the twin. `make codegen`.
version: v2
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-es
    out: client/src/brains/wire/gen
    opt:
      - target=ts
  - remote: buf.build/protocolbuffers/python:v29.3
    out: sim/twin/wire
  - remote: buf.build/protocolbuffers/pyi:v29.3
    out: sim/twin/wire
