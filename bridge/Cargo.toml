[package]
name = "robot-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
prost = "0.14.4"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-tungstenite = "0.30.0"
tower-http = { version = "0.7.1", features = ["fs"] }

[build-dependencies]
prost-build = "0.14.4"
protox = "0.9.1"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["io-util"] }
